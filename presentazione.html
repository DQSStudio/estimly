<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentazione</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --accent:#4338CA; --ink:#17181C; --ink-soft:#7A7C85; --border:#E6E6E9; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; background:#FAFAFA; color:var(--ink); }
  .wrap{ max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  .bar{ height:5px; background:var(--accent); border-radius:3px; margin-bottom:16px; }
  .head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .head img{ max-height:44px; max-width:170px; object-fit:contain; }
  .head .name{ font-weight:700; font-size:16px; }
  .sub{ font-size:11.5px; color:var(--ink-soft); }
  h1{ font-size:20px; margin:0 0 6px; }
  p{ font-size:14px; line-height:1.6; color:#444; margin:0 0 16px; }
  .frame{ position:relative; width:100%; padding-top:56.25%; background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .btn{ display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:12px 26px; border-radius:8px; font-weight:600; font-size:14px; }
  .center{ text-align:center; padding:60px 16px; color:var(--ink-soft); font-size:14px; }
  .foot{ margin-top:18px; font-size:12.5px; color:var(--ink-soft); }
</style>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="wrap" id="app"><div class="center">Caricamento…</div></div>
<script>
(function(){
  var app = document.getElementById('app');
  var token = new URLSearchParams(location.search).get('t') || '';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fail(){ app.innerHTML = '<div class="center">Questa presentazione non è disponibile. Controlla il link ricevuto via email.</div>'; }
  if(!token){ fail(); return; }
  fetch('/.netlify/functions/public-quote', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ mode:'get-presentation', token: token })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !d.ok){ fail(); return; }
    var s = d.studio || {};
    if(/^#[0-9a-fA-F]{6}$/.test(s.colorPrimary||'')) document.documentElement.style.setProperty('--accent', s.colorPrimary);
    document.title = 'Presentazione — ' + (s.nome || 'Studio');
    var bits = [s.indirizzo, s.telefono, s.email].filter(Boolean).map(esc).join(' · ');
    var first = (d.nome || '').trim().split(/\s+/)[0];
    var logo = /^data:image\/|^https:\/\//.test(s.logo||'') ? '<img src="'+esc(s.logo)+'" alt="">' : '';
    var body = d.embedUrl
      ? '<div class="frame"><iframe src="'+esc(d.embedUrl)+'" allowfullscreen loading="lazy" title="Presentazione"></iframe></div>'
        + '<p class="foot">Non si carica? <a href="'+esc(d.url)+'" target="_blank" rel="noopener">Aprila in una nuova scheda</a>.</p>'
      : '<p style="text-align:center; margin:30px 0;"><a class="btn" href="'+esc(d.url)+'" target="_blank" rel="noopener">Apri la presentazione &rarr;</a></p>';
    app.innerHTML =
      '<div class="bar"></div>'
      + '<div class="head">'+logo+'<div><div class="name">'+esc(s.nome||'Studio')+'</div>'+(bits?'<div class="sub">'+bits+'</div>':'')+'</div></div>'
      + '<h1>'+(first ? 'Ciao '+esc(first)+', ecco la nostra presentazione' : 'La nostra presentazione')+'</h1>'
      + '<p>Abbiamo preparato per te una presentazione del progetto. Se vuoi parlarne o hai domande, rispondi pure all\'email ricevuta.</p>'
      + body;
  }).catch(fail);
})();
</script>
</body>
</html>
