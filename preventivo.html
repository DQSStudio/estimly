<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivo</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --accent:#4338CA; --accent-soft:#EEEDFB; --ink:#17181C; --ink-soft:#7A7C85; --ink-faint:#B4B5BD;
    --border:#E6E6E9; --surface:#FFFFFF; --surface-alt:#F3F3F6; --radius:16px; --radius-sm:10px;
    --danger:#C0392B; --success:#0F8A5F;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; background:#FAFAFA; color:var(--ink); }
  .wrap{ max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .center-msg{ text-align:center; padding:80px 20px; color:var(--ink-soft); font-size:14px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:0 8px 24px -8px rgba(23,24,28,0.10); overflow:hidden; }
  .card-body{ padding:22px 20px 24px; }
  .section-label{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin:20px 0 10px; }

  /* ===== Documento preventivo (stesso formato del PDF allegato in passato all'email / di
     "Stampa e Salva PDF" in Estimly — vedi buildPrintDoc() in index.html): intestazione studio,
     blocchi cliente/progetto, tabella voci per categoria, totali. Qui sempre visibile a schermo
     (non solo in stampa) e in più catturata via html2canvas per generare sia l'anteprima che il
     PDF scaricabile dopo la firma (vedi buildSignedDocumentNode). ===== */
  .pd-accent-bar{ height:5px; background:var(--accent); border-radius:3px; margin-bottom:16px; }
  .pd-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding-bottom:12px; border-bottom:2px solid var(--accent); margin-bottom:14px; flex-wrap:wrap; }
  .pd-brand{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:0; }
  /* Il logo mantiene sempre le proporzioni originali (width/height auto + max-*), allineato a
     sinistra: con object-fit dentro una colonna flex veniva stirato al contenitore e, nel PDF
     (html2canvas non supporta object-fit), deformato. */
  .pd-logo{ display:block; width:auto; height:auto; max-height:64px; max-width:220px; }
  .pd-brand-name{ font-weight:700; font-size:17px; color:#111; }
  .pd-brand-sub{ font-size:11px; color:#666; max-width:420px; }
  .pd-meta{ text-align:right; }
  .pd-doc-title{ font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:5px; }
  .pd-meta-grid{ display:inline-grid; grid-template-columns:auto auto; gap:2px 10px; font-size:11.5px; color:#555; text-align:left; }
  .pd-meta-grid b{ color:#111; font-weight:600; text-align:right; }
  .pd-meta-standalone{ text-align:left; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #ddd; }
  .pd-letterhead-header{ display:block; width:100%; height:auto; margin-bottom:14px; }
  .pd-letterhead-footer{ display:block; width:100%; height:auto; margin-top:18px; }

  .pd-parties{ display:flex; flex-wrap:wrap; gap:20px; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid #ddd; }
  .pd-party{ flex:1; min-width:140px; }
  .pd-party-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--accent); font-weight:600; margin-bottom:3px; }
  .pd-party-name{ font-weight:600; font-size:14.5px; color:#111; }
  .pd-party div{ font-size:12px; color:#444; }

  .pd-table-scroll{ overflow-x:auto; margin-bottom:12px; -webkit-overflow-scrolling:touch; }
  .pd-table{ width:100%; min-width:460px; border-collapse:collapse; font-size:12.5px; }
  .pd-table thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:#666; border-bottom:2px solid var(--accent); padding:6px 6px 8px; white-space:nowrap; }
  /* Righe più spaziate (richiesta dello studio): un po' più d'aria sopra/sotto ogni voce. */
  .pd-table td{ padding:10px 6px; border-bottom:1px solid #eee; vertical-align:top; }
  .pd-table .pd-cat-row td{
    background:var(--pd-accent-soft, #EEEDFB); border-left:3px solid var(--accent); border-bottom:1px solid #eee;
    font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--accent);
    padding:9px 8px;
  }
  .pd-code{ font-family:ui-monospace,monospace; font-size:11px; color:#888; white-space:nowrap; }
  .pd-num{ text-align:right; white-space:nowrap; font-family:ui-monospace,monospace; }
  .pd-strong{ font-weight:600; }
  .pd-empty{ text-align:center; color:#999; padding:16px; }
  .pd-item-name{ font-weight:500; color:#111; }
  .pd-item-desc{ font-size:10.5px; color:#777; margin-top:4px; line-height:1.5; }
  .pd-item-note{ font-size:10.5px; color:#a15c00; font-style:italic; margin-top:4px; }

  /* Combinazioni di font/layout scelte dallo studio (stesse regole del PDF di Estimly). */
  .doc-root[data-font="minimale"] .pd-code,
  .doc-root[data-font="minimale"] .pd-num{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .doc-root[data-font="tecnico"] .pd-doc-title,
  .doc-root[data-font="tecnico"] .pd-party-label{ font-family:ui-monospace,monospace; letter-spacing:0.5px; }
  .doc-root[data-custom-font],
  .doc-root[data-custom-font] *{ font-family:'EstimlyCustomFont',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif !important; }
  .doc-root[data-layout="minimale"] .pd-accent-bar{ display:none; }
  .doc-root[data-layout="minimale"] .pd-header{ border-bottom:1px solid #ddd; }
  .doc-root[data-layout="minimale"] .pd-table thead th{ border-bottom:1px solid #ccc; color:#888; }
  .doc-root[data-layout="minimale"] .pd-table .pd-cat-row td{ background:transparent; border-left:none; color:#333; }
  .doc-root[data-layout="minimale"] .pd-total-row.pd-grand{ border-top:1px solid #ccc; color:#111; }
  .doc-root[data-layout="minimale"] .pd-total-row.pd-grand span:last-child{ color:#111; }
  .doc-root[data-layout="banner"] .pd-accent-bar{ display:none; }
  .doc-root[data-layout="banner"] .pd-header{ border:2px solid var(--accent); border-radius:8px; padding:16px 20px; margin-bottom:18px; }

  .pd-totals{ max-width:300px; margin-left:auto; }
  .pd-total-row{ display:flex; justify-content:space-between; font-size:12.5px; color:#555; padding:3px 0; }
  .pd-total-row.pd-grand{ font-weight:700; font-size:16px; color:#111; border-top:2px solid var(--accent); margin-top:5px; padding-top:7px; }
  .pd-total-row.pd-grand span:last-child{ color:var(--accent); }
  .pd-nota{ font-size:10px; color:#777; font-style:italic; margin-top:7px; text-align:right; }
  .pd-payment{ font-size:11px; color:#444; margin-top:14px; padding-top:9px; border-top:1px dashed #ccc; }

  .cert-sign-box{ margin-top:22px; border:1.5px solid #E6E6E9; border-radius:12px; padding:16px 18px; }
  .cert-sign-box .h{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:#7A7C85; margin-bottom:10px; }
  .cert-meta-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; gap:14px; }
  .cert-meta-row .k{ color:#7A7C85; flex-shrink:0; }
  .cert-meta-row .v{ font-weight:600; text-align:right; }
  .cert-meta-row.stack{ display:block; padding-top:8px; }
  .cert-meta-row.stack .k{ display:block; margin-bottom:3px; }
  .cert-meta-row.stack .v{ display:block; text-align:left; word-break:break-all; font-weight:400; }
  .cert-sign-img{ max-width:260px; max-height:90px; margin:10px 0; display:block; }
  .cert-legal{ font-size:10.5px; color:#7A7C85; line-height:1.5; margin-top:12px; }
  @media (max-width:480px){
    .pd-header{ flex-direction:column; }
    .pd-meta{ text-align:left; }
    .pd-meta-grid{ text-align:left; }
    .pd-meta-grid b{ text-align:left; }
  }
  .sign-pad-wrap{ border:1.5px dashed #C7C9D1; border-radius:14px; background:#FCFCFD; position:relative; touch-action:none; }
  .sign-pad-wrap canvas{ display:block; width:100%; height:140px; border-radius:14px; }
  .sign-hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:14px; pointer-events:none; }
  .sign-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .link-btn{ background:none; border:none; color:var(--accent); font-size:11.5px; font-weight:600; cursor:pointer; padding:4px 0; }
  .field{ margin-top:12px; }
  .field label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input[type=text]{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; font-family:inherit; background:#fff; color:var(--ink); }
  .check-row{ display:flex; align-items:flex-start; gap:8px; margin-top:16px; font-size:11.5px; color:var(--ink-soft); line-height:1.5; cursor:pointer; }
  .check-row input{ margin-top:2px; width:15px; height:15px; accent-color:var(--accent); flex-shrink:0; }
  .btn-primary{ width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:16px; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-secondary{ width:100%; padding:11px; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--ink); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:8px; }
  .hint-row{ font-size:11px; color:var(--ink-faint); line-height:1.5; margin-top:10px; text-align:center; }
  .error-box{ font-size:12px; color:var(--danger); background:#FDEEEC; border-radius:var(--radius-sm); padding:10px 12px; margin-top:10px; }
  .signed-badge{ display:flex; align-items:center; gap:8px; background:#E7F6EF; color:var(--success); border-radius:var(--radius-sm); padding:14px; font-size:13px; font-weight:600; margin-top:18px; }
  .signed-sub{ font-size:11.5px; font-weight:400; color:#0F8A5F; margin-top:3px; }
  .payment-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid #F1F1F3; }
  .payment-row:last-child{ border-bottom:none; }
  .payment-row .label{ font-size:12.5px; font-weight:600; }
  .payment-row .amount{ font-size:12px; color:var(--ink-soft); margin-top:2px; font-variant-numeric:tabular-nums; }
  .payment-row .paid-badge{ font-size:11px; font-weight:700; color:var(--success); background:#E7F6EF; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .pay-btn{ padding:8px 14px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .pay-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  /* Contenitore fuori schermo usato da html2canvas per catturare il documento firmato (vedi
     buildSignedDocumentNode): stessa identità visiva del preventivo online, dimensioni fisse
     indipendenti dal viewport del cliente, così il PDF generato è sempre uguale. */
  .cert-wrap{ width:703px; padding:0; background:#fff; color:#17181C; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .signed-download-btn{ display:inline-block; margin-top:10px; font-size:11.5px; font-weight:600; color:var(--accent); text-decoration:none; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="center-msg" id="loadingMsg">Caricamento preventivo…</div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script>
(function(){
  const REGIMI_FISCALI = {
    ord22:{label:'IVA ordinaria 22%', rate:0.22, nota:''},
    rid10:{label:'IVA ridotta 10%', rate:0.10, nota:''},
    rid4:{label:'IVA ridotta 4%', rate:0.04, nota:''},
    esente:{label:'Esente IVA', rate:0, nota:'Operazione esente IVA ai sensi dell\'art. 10 DPR 633/72'},
    forfettario:{label:'Regime forfettario', rate:0, nota:'Operazione senza applicazione dell\'IVA ai sensi dell\'art. 1, commi 54-89, L. 190/2014 (regime forfettario)'},
    reverse:{label:'Reverse charge', rate:0, nota:'Operazione soggetta a inversione contabile (reverse charge) ai sensi dell\'art. 17, comma 6, DPR 633/72 — IVA a carico del committente'},
    custom:{label:'Aliquota personalizzata', rate:null, nota:''}
  };

  function fmt(n){
    return new Intl.NumberFormat('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n || 0);
  }
  function esc(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function lineTotal(l){
    return l.modalita === 'orario' ? (l.ore||0)*(l.tariffa||0) : (l.qty||0)*(l.prezzo||0);
  }
  function regimeAttivo(quote){
    const r = REGIMI_FISCALI[quote.regime] || REGIMI_FISCALI.ord22;
    if(quote.regime === 'custom') return { label:`IVA ${fmt(quote.aliquotaCustom)}%`, rate:(quote.aliquotaCustom||0)/100, nota:'' };
    return r;
  }
  function computeTotals(quote){
    const imponibile = quote.cart.reduce((s,l)=>s+lineTotal(l),0);
    const sconto = imponibile * (quote.sconto||0) / 100;
    const netto = imponibile - sconto;
    const contributo = netto * (quote.contributoPct||0) / 100;
    const baseIva = netto + contributo;
    const regime = regimeAttivo(quote);
    const iva = baseIva * regime.rate;
    const totale = baseIva + iva;
    return { imponibile, sconto, contributo, iva, totale, regime };
  }

  function getToken(){
    const params = new URLSearchParams(window.location.search);
    return (params.get('t') || '').trim();
  }

  const app = document.getElementById('app');
  const token = getToken();
  let currentStudio = null;

  function renderError(message){
    app.innerHTML = `<div class="center-msg">${esc(message)}</div>`;
  }

  if(!token){
    renderError('Link non valido. Controlla di aver copiato l\'indirizzo completo ricevuto dallo studio.');
    return;
  }

  async function confirmPendingPaymentIfAny(quote){
    const params = new URLSearchParams(window.location.search);
    const paymentId = params.get('paid');
    const sessionId = params.get('session_id');
    if(!paymentId || !sessionId) return quote;
    // Ripulisce l'URL subito, prima di qualunque await: se la conferma fallisce o l'utente
    // ricarica la pagina, non deve ritrovarsi con lo stesso session_id riproposto.
    params.delete('paid'); params.delete('session_id');
    const qs = params.toString();
    window.history.replaceState({}, '', window.location.pathname + (qs ? `?${qs}` : ''));
    try{
      const res = await fetch('/.netlify/functions/stripe-connect', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ mode:'confirm-payment', token, paymentId, sessionId })
      });
      const data = await res.json();
      if(data.ok && Array.isArray(data.pagamenti)){
        quote.pagamenti = data.pagamenti;
      }
    }catch(err){ /* se la conferma fallisce, il pagamento resta "in attesa": lo studio può comunque verificarlo dalla sua dashboard Stripe */ }
    return quote;
  }

  fetch('/.netlify/functions/public-quote', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ mode:'get', token })
  }).then(r=>r.json()).then(async data=>{
    if(data.error){
      renderError('Non riusciamo a trovare questo preventivo. Il link potrebbe non essere più valido: contatta lo studio per riceverne uno nuovo.');
      return;
    }
    const quote = await confirmPendingPaymentIfAny(data.quote);
    render(data.studio, quote);
  }).catch(()=>{
    renderError('Errore di connessione. Riprova tra poco.');
  });

  function hexToSoft(hex){
    try{
      const h = (hex || '').replace('#','');
      const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
      return `rgba(${r}, ${g}, ${b}, 0.1)`;
    }catch(e){ return '#EEEDFB'; }
  }

  // Applica il colore dello studio come colore di accento di tutta la pagina (bottoni,
  // intestazione del documento, riquadri categoria) invece del viola fisso usato finora: così
  // il preventivo online ha la stessa identità visiva del PDF/email, che usano già s.colorPrimary.
  function applyAccent(color){
    const accent = color || '#4338CA';
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--pd-accent-soft', hexToSoft(accent));
  }

  function addDays(dateStr, days){
    if(!dateStr) return '—';
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d.getTime())) return '—';
    d.setDate(d.getDate() + (parseInt(days,10)||0));
    return d.toLocaleDateString('it-IT');
  }

  // Raggruppa le voci per categoria mantenendo l'ordine di prima comparsa nel carrello (qui non
  // disponiamo dell'ordine categorie del listino dello studio, usato invece in index.html): è
  // un'approssimazione ragionevole, dato che le voci sono quasi sempre già inserite in un ordine
  // sensato. "Voci libere" va comunque sempre per ultima, come nel PDF.
  function groupByCategoria(cart){
    const byCat = {};
    const order = [];
    cart.forEach(l=>{
      const cat = l.categoria || 'Altro';
      if(!byCat[cat]){ byCat[cat] = []; order.push(cat); }
      byCat[cat].push(l);
    });
    order.sort((a,b)=>{
      if(a==='Voci libere') return 1;
      if(b==='Voci libere') return -1;
      return 0;
    });
    return order.map(cat => ({ cat, items: byCat[cat] }));
  }

  // Costruisce il documento del preventivo nello stesso formato del PDF che Estimly produce per
  // lo studio (buildPrintDoc in index.html, usato anche per il vecchio allegato email): intestazione
  // con logo/dati studio, blocchi cliente/progetto, tabella voci per categoria (codice, descrizione,
  // qtà/ore, prezzo unitario, totale) e riepilogo totali. Usata sia per la vista online (dentro
  // #app) sia, con signatureHtml valorizzato, per il PDF scaricabile dopo la firma.
  function buildQuoteDocumentHtml(studio, quote, signatureHtml, opts){
    const forPdf = !!(opts && opts.forPdf);
    const useLH = studio.letterheadMode === 'custom' && !!studio.letterheadHeader;
    const totals = computeTotals(quote);
    const dataLabel = quote.data ? new Date(quote.data+'T00:00:00').toLocaleDateString('it-IT') : '—';
    const validitaLabel = addDays(quote.data, quote.validita);
    const fiscaleCliente = [quote.cf, quote.piva].filter(Boolean).join(' / ');
    const hidePrices = !!quote.hidePrices;
    const colCount = hidePrices ? 3 : 5;

    let rowsHtml = '';
    if(!quote.cart.length){
      rowsHtml = `<tr><td colspan="${colCount}" class="pd-empty">Nessuna voce inserita.</td></tr>`;
    } else {
      groupByCategoria(quote.cart).forEach(({cat, items})=>{
        rowsHtml += `<tr class="pd-cat-row"><td colspan="${colCount}">${esc(cat)}</td></tr>`;
        items.forEach(l=>{
          const isOrario = l.modalita === 'orario';
          const qty = isOrario ? `${fmt(l.ore)} h` : `${l.qty} ${l.um||'cad'}`;
          const unit = isOrario ? l.tariffa : l.prezzo;
          rowsHtml += `<tr>
            <td class="pd-code">${esc(l.codice || '—')}</td>
            <td>
              <div class="pd-item-name">${esc(l.nome)}</div>
              ${l.descrizione ? `<div class="pd-item-desc">${esc(l.descrizione)}</div>` : ''}
              ${l.nota ? `<div class="pd-item-note">Nota: ${esc(l.nota)}</div>` : ''}
            </td>
            <td class="pd-num">${qty}</td>
            ${hidePrices ? '' : `
            <td class="pd-num">€ ${fmt(unit)}</td>
            <td class="pd-num pd-strong">€ ${fmt(lineTotal(l))}</td>`}
          </tr>`;
        });
      });
    }

    const totalsHtml = hidePrices ? '' : `
      <div class="pd-totals">
        <div class="pd-total-row"><span>Imponibile</span><span>€ ${fmt(totals.imponibile)}</span></div>
        ${totals.sconto > 0 ? `<div class="pd-total-row"><span>Sconto</span><span>− € ${fmt(totals.sconto)}</span></div>` : ''}
        ${quote.contributoPct > 0 ? `<div class="pd-total-row"><span>${esc(quote.contributoLabel || 'Contributo')} (${fmt(quote.contributoPct)}%)</span><span>€ ${fmt(totals.contributo)}</span></div>` : ''}
        <div class="pd-total-row"><span>${esc(totals.regime.label)}</span><span>€ ${fmt(totals.iva)}</span></div>
        <div class="pd-total-row pd-grand"><span>Totale</span><span>€ ${fmt(totals.totale)}</span></div>
      </div>`;

    const studioBits = [studio.indirizzo, studio.piva?('P.IVA '+studio.piva):'', studio.telefono, studio.email].filter(Boolean).map(esc).join(' &middot; ');

    let paymentHtml = '';
    const hasPayment = studio.iban || studio.intestatario || studio.banca || studio.sdi || quote.notePagamento;
    if(hasPayment){
      const bits = [];
      if(studio.iban) bits.push(`IBAN <b>${esc(studio.iban)}</b>`);
      if(studio.intestatario) bits.push(`Intestatario <b>${esc(studio.intestatario)}</b>`);
      if(studio.banca) bits.push(`Banca <b>${esc(studio.banca)}</b>`);
      if(studio.sdi) bits.push(`SDI <b>${esc(studio.sdi)}</b>`);
      paymentHtml = `<div class="pd-payment"><b>Pagamento</b>${bits.length?' — '+bits.join(' &nbsp;&middot;&nbsp; '):''}${quote.notePagamento?`<br>${esc(quote.notePagamento)}`:''}</div>`;
    }

    const metaGrid = `
            <span>N.</span><b>${esc(quote.numero || '—')}</b>
            <span>Data</span><b>${dataLabel}</b>
            ${quote.revisione ? `<span>Rev.</span><b>${esc(quote.revisione)}</b>` : ''}
            <span>Valido fino al</span><b>${validitaLabel}</b>`;
    // Con carta intestata personalizzata (come nel PDF di Estimly): l'immagine di intestazione
    // sostituisce logo e dati studio, e sotto restano solo titolo e riferimenti del documento. Nel
    // PDF le immagini di intestazione/piè di pagina vengono applicate su ogni pagina (vedi
    // generateSignedDocumentPdf), quindi qui non vanno incluse.
    const headerHtml = useLH ? `
      ${forPdf ? '' : `<img src="${studio.letterheadHeader}" alt="" class="pd-letterhead-header">`}
      <div class="pd-meta pd-meta-standalone">
        <div class="pd-doc-title">Preventivo</div>
        <div class="pd-meta-grid">${metaGrid}</div>
      </div>` : `
      <div class="pd-accent-bar"></div>
      <div class="pd-header">
        <div class="pd-brand">
          ${studio.logo ? `<img src="${studio.logo}" alt="" class="pd-logo">` : ''}
          <div class="pd-brand-name">${esc(studio.nome || 'Studio')}</div>
          ${studioBits ? `<div class="pd-brand-sub">${studioBits}</div>` : ''}
        </div>
        <div class="pd-meta">
          <div class="pd-doc-title">Preventivo</div>
          <div class="pd-meta-grid">${metaGrid}</div>
        </div>
      </div>`;
    const footerHtml = (useLH && !forPdf && studio.letterheadFooter) ? `<img src="${studio.letterheadFooter}" alt="" class="pd-letterhead-footer">` : '';
    const rootAttrs = `class="doc-root" data-font="${esc(studio.fontPairing || 'moderno')}" data-layout="${esc(studio.pdfLayout || 'classico')}"${studio.customFontData ? ' data-custom-font' : ''}`;

    return `
      <div ${rootAttrs}>
      ${headerHtml}
      <div class="pd-parties">
        <div class="pd-party">
          <div class="pd-party-label">Cliente</div>
          <div class="pd-party-name">${esc(quote.cliente || '—')}</div>
          ${(quote.tipoCliente || quote.indirizzo) ? `<div>${esc(quote.tipoCliente)}${quote.indirizzo?' &middot; '+esc(quote.indirizzo):''}</div>` : ''}
          ${fiscaleCliente ? `<div>${esc(fiscaleCliente)}</div>` : ''}
        </div>
        ${quote.progetto ? `<div class="pd-party"><div class="pd-party-label">Progetto</div><div class="pd-party-name">${esc(quote.progetto)}</div></div>` : ''}
      </div>
      <div class="pd-table-scroll">
        <table class="pd-table">
          <thead><tr><th>Codice</th><th>Descrizione</th><th>Qt&agrave;/Ore</th>${hidePrices ? '' : '<th>Prezzo unit.</th><th>Totale</th>'}</tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      ${totalsHtml}
      ${totals.regime.nota ? `<div class="pd-nota">${esc(totals.regime.nota)}</div>` : ''}
      ${paymentHtml}
      ${signatureHtml || ''}
      ${footerHtml}
      </div>
    `;
  }

  // Font personalizzato dello studio (lo stesso caricato in Estimly): senza di esso il documento
  // online e il PDF non avrebbero lo stesso aspetto del PDF classico.
  function ensureStudioFont(studio){
    let el = document.getElementById('studioFontStyle');
    if(!studio.customFontData){ if(el) el.textContent = ''; return; }
    if(!el){ el = document.createElement('style'); el.id = 'studioFontStyle'; document.head.appendChild(el); }
    const fmtName = String(studio.customFontFormat || '').replace(/[^a-z0-9-]/gi, '');
    const fmtAttr = fmtName ? ` format('${fmtName}')` : '';
    el.textContent = `@font-face{ font-family:'EstimlyCustomFont'; src:url(${studio.customFontData})${fmtAttr}; font-weight:normal; font-style:normal; }`;
  }

  function loadImage(src){
    return new Promise(resolve => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = src;
    });
  }

  // Dimensiona il logo dello studio sempre in proporzione (mai stirato) dentro un riquadro
  // massimo 220x64 px, anche ingrandendo i logo piccoli (fino a 3 volte): le dimensioni vengono
  // scritte esplicitamente perché html2canvas (PDF) non rispetta object-fit.
  async function fitLogos(root){
    const imgs = Array.from(root.querySelectorAll('img.pd-logo'));
    await Promise.all(imgs.map(async img => {
      const im = await loadImage(img.src);
      if(!im || !im.naturalWidth || !im.naturalHeight) return;
      const k = Math.min(220 / im.naturalWidth, 64 / im.naturalHeight, 3);
      img.style.width = Math.round(im.naturalWidth * k) + 'px';
      img.style.height = Math.round(im.naturalHeight * k) + 'px';
      img.style.maxWidth = 'none'; img.style.maxHeight = 'none';
    }));
  }

  function render(studio, quote){
    currentStudio = studio;
    applyAccent(studio.colorPrimary);
    ensureStudioFont(studio);

    app.innerHTML = `
      <div class="card">
        <div class="card-body" id="quoteDocBody">
          ${buildQuoteDocumentHtml(studio, quote)}
          <div id="signArea"></div>
          <div id="paymentsArea"></div>
        </div>
      </div>
    `;

    fitLogos(app);
    renderSignArea(quote);
    renderPaymentsArea(quote);
  }

  function paymentStatusLabel(p){
    return p.stato === 'pagato'
      ? `<span class="paid-badge">✓ Pagato</span>`
      : `<button type="button" class="pay-btn" data-pay-id="${esc(p.id)}">Paga adesso</button>`;
  }

  function renderPaymentsArea(quote){
    const area = document.getElementById('paymentsArea');
    const pagamenti = Array.isArray(quote.pagamenti) ? quote.pagamenti : [];
    // Le richieste di pagamento compaiono solo dopo la firma (è lo studio a crearle a quel punto,
    // una o più volte nel tempo — es. acconto, saldo a 30gg — tutte legate a questo preventivo).
    if(!quote.firma || !quote.firma.firmato || !pagamenti.length){
      area.innerHTML = '';
      return;
    }
    area.innerHTML = `
      <div class="section-label">Pagamenti</div>
      <div>${pagamenti.map(p => `
        <div class="payment-row">
          <div>
            <div class="label">${esc(p.label)}</div>
            <div class="amount">€ ${fmt((p.importoCent||0)/100)}</div>
          </div>
          ${paymentStatusLabel(p)}
        </div>`).join('')}</div>
      <div id="paymentErrorBox"></div>
    `;
    area.querySelectorAll('[data-pay-id]').forEach(btn => {
      btn.addEventListener('click', () => startPayment(btn.getAttribute('data-pay-id'), btn));
    });

  async function startPayment(paymentId, btn){
    const errBox = document.getElementById('paymentErrorBox');
    if(errBox) errBox.innerHTML = '';
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Attendere…';
    try{
      const res = await fetch('/.netlify/functions/stripe-connect', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ mode:'create-checkout-session', token, paymentId, origin: window.location.origin })
      });
      const data = await res.json();
      if(data.error || !data.url){
        if(errBox) errBox.innerHTML = '<div class="error-box">Non è stato possibile avviare il pagamento. Riprova o contatta lo studio.</div>';
        btn.disabled = false; btn.textContent = originalText;
        return;
      }
      window.location.href = data.url;
    }catch(err){
      if(errBox) errBox.innerHTML = '<div class="error-box">Errore di connessione. Riprova.</div>';
      btn.disabled = false; btn.textContent = originalText;
    }
  }

  // ---------- Documento di accettazione firmato (PDF da conservare) ----------
  // Generato subito dopo la firma (lato client, stesso approccio html2canvas+jsPDF usato in
  // Estimly per il PDF del preventivo), poi caricato su Estimly tramite 'store-signed-document'
  // così lo studio può conservarlo e riscaricarlo in qualsiasi momento. Include anche i dati
  // della firma restituiti dal server (ip, hashDocumento) come prova, oltre a quelli locali
  // (nome, metodo, immagine firma se disegnata).

  // Il documento di accettazione firmato è ora lo stesso identico formato del preventivo
  // (buildQuoteDocumentHtml, vedi sopra — intestazione, cliente/progetto, tabella voci, totali),
  // con in più il blocco di firma "in calce": così il PDF che il cliente scarica dopo aver
  // firmato è riconoscibile come il preventivo stesso, non un certificato a parte riassuntivo
  // come in precedenza.
  function buildSignedDocumentNode(studio, quote){
    const firma = quote.firma || {};
    const firmatoLabel = firma.firmatoAt ? new Date(firma.firmatoAt).toLocaleString('it-IT') : '—';
    const metodoLabel = firma.metodo === 'disegnata' ? 'Firma disegnata' : 'Nome digitato';

    const signatureHtml = `
      <div class="cert-sign-box">
        <div class="h">Firma e accettazione</div>
        <div class="cert-meta-row"><span class="k">Firmatario</span><span class="v">${esc(firma.firmatarioNome || '—')}</span></div>
        <div class="cert-meta-row"><span class="k">Metodo</span><span class="v">${esc(metodoLabel)}</span></div>
        <div class="cert-meta-row"><span class="k">Data e ora</span><span class="v">${esc(firmatoLabel)}</span></div>
        ${firma.ip ? `<div class="cert-meta-row"><span class="k">Indirizzo IP</span><span class="v">${esc(firma.ip)}</span></div>` : ''}
        ${firma.hashDocumento ? `<div class="cert-meta-row stack"><span class="k">Impronta documento (SHA-256)</span><span class="v" style="font-family:monospace; font-size:10.5px;">${esc(firma.hashDocumento)}</span></div>` : ''}
        ${(firma.metodo === 'disegnata' && firma.firmaImage) ? `<img class="cert-sign-img" src="${firma.firmaImage}" alt="Firma">` : ''}
        <div class="cert-legal">Firma elettronica semplice (SES) ai sensi del Regolamento eIDAS (UE) 910/2014, art. 25. Data/ora, indirizzo IP e impronta del documento sono stati registrati al momento della firma come prova dell'accettazione del preventivo sopra riportato.</div>
      </div>
    `;

    const node = document.createElement('div');
    node.className = 'cert-wrap';
    node.innerHTML = buildQuoteDocumentHtml(studio, quote, signatureHtml, { forPdf: true });
    node.style.cssText = 'position:absolute; left:-10000px; top:0; z-index:-1;';
    document.body.appendChild(node);
    return node;
  }

  // ---------- Impaginazione PDF ----------
  // Come nel PDF di stampa di Estimly: A4 con margini di 12 mm, carta intestata (immagine di
  // intestazione e di piè di pagina) ripetuta su OGNI pagina, intestazione delle colonne della
  // tabella ripetuta quando una pagina riprende a metà tabella. Il corpo del documento viene
  // catturato una sola volta (html2canvas) e tagliato solo tra una riga e l'altra della tabella,
  // mai a metà di una voce, di un blocco totali o del riquadro firma.
  const PDF_MARGIN_MM = 12;
  const PDF_GAP_MM = 5;

  function imageForPdf(im, src){
    const m = /^data:image\/(png|jpe?g)/i.exec(src);
    if(m) return { data: src, fmt: m[1].toLowerCase() === 'png' ? 'PNG' : 'JPEG' };
    const c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
    cx.drawImage(im, 0, 0);
    return { data: c.toDataURL('image/jpeg', 0.92), fmt: 'JPEG' };
  }

  function collectBreakPoints(node, scale){
    const top = node.getBoundingClientRect().top;
    const sel = 'tr, .pd-meta-standalone, .pd-header, .pd-parties, .pd-totals, .pd-nota, .pd-payment, .cert-sign-box';
    const pts = Array.from(node.querySelectorAll(sel)).map(el => ({
      bottom: Math.round((el.getBoundingClientRect().bottom - top) * scale),
      isCat: el.classList.contains('pd-cat-row')
    })).filter(p => p.bottom > 0);
    pts.sort((a, b) => a.bottom - b.bottom);
    return pts;
  }

  async function generateSignedDocumentPdf(studio, quote){
    if(typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF || typeof window.html2canvas !== 'function') return null;
    ensureStudioFont(studio);
    const node = buildSignedDocumentNode(studio, quote);
    let result = null;
    try{
      await fitLogos(node);
      try{
        if(studio.customFontData && document.fonts && document.fonts.load) await document.fonts.load("12px 'EstimlyCustomFont'");
        if(document.fonts && document.fonts.ready) await document.fonts.ready;
      }catch(e){ /* senza font personalizzato il documento usa il font di sistema */ }

      const useLH = studio.letterheadMode === 'custom' && !!studio.letterheadHeader;
      const hdrIm = useLH ? await loadImage(studio.letterheadHeader) : null;
      const ftrIm = (useLH && studio.letterheadFooter) ? await loadImage(studio.letterheadFooter) : null;

      const CAP_SCALE = 2.5;
      const canvas = await window.html2canvas(node, { scale: CAP_SCALE, useCORS:true, backgroundColor:'#ffffff', windowWidth: node.offsetWidth });
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'mm', format:'a4' });

      const W = 210, H = 297, CW = W - PDF_MARGIN_MM * 2;
      const hh = hdrIm ? CW * hdrIm.naturalHeight / hdrIm.naturalWidth : 0;
      const fh = ftrIm ? CW * ftrIm.naturalHeight / ftrIm.naturalWidth : 0;
      const topY = PDF_MARGIN_MM + (hdrIm ? hh + PDF_GAP_MM : 0);
      const bottomReserve = PDF_MARGIN_MM + (ftrIm ? fh + PDF_GAP_MM : 0);
      const pxPerMm = canvas.width / CW;
      const areaPx = Math.floor((H - topY - bottomReserve) * pxPerMm);
      const hdrPdf = hdrIm ? imageForPdf(hdrIm, studio.letterheadHeader) : null;
      const ftrPdf = ftrIm ? imageForPdf(ftrIm, studio.letterheadFooter) : null;

      const scale = canvas.width / node.offsetWidth;
      const pts = collectBreakPoints(node, scale);
      const nodeTop = node.getBoundingClientRect().top;
      const theadEl = node.querySelector('.pd-table thead');
      const tableEl = node.querySelector('.pd-table');
      const theadTop = theadEl ? Math.round((theadEl.getBoundingClientRect().top - nodeTop) * scale) : 0;
      const theadBottom = theadEl ? Math.round((theadEl.getBoundingClientRect().bottom - nodeTop) * scale) : 0;
      const tableBottom = tableEl ? Math.round((tableEl.getBoundingClientRect().bottom - nodeTop) * scale) : 0;
      const stripH = theadBottom - theadTop;

      let start = 0, pageIdx = 0;
      while(start < canvas.height){
        const needStrip = theadEl && pageIdx > 0 && start >= theadBottom && start < tableBottom;
        const avail = areaPx - (needStrip ? stripH : 0);
        let end = Math.min(start + avail, canvas.height);
        if(end < canvas.height){
          // Punto di taglio: l'ultimo bordo di riga entro lo spazio disponibile; se subito prima
          // del taglio c'è una riga-categoria (titolo rimasto solo a fine pagina) si taglia prima.
          let idx = -1;
          for(let k = pts.length - 1; k >= 0; k--){
            if(pts[k].bottom <= end && pts[k].bottom > start + 30){ idx = k; break; }
          }
          while(idx >= 0 && pts[idx].isCat){
            idx--;
            while(idx >= 0 && pts[idx].bottom <= start + 30) idx--;
          }
          if(idx >= 0) end = pts[idx].bottom;
        }
        const sliceH = end - start;
        const pageCanvas = document.createElement('canvas');
        pageCanvas.width = canvas.width;
        pageCanvas.height = sliceH + (needStrip ? stripH : 0);
        const pcx = pageCanvas.getContext('2d');
        pcx.fillStyle = '#fff'; pcx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
        let yy = 0;
        if(needStrip){ pcx.drawImage(canvas, 0, theadTop, canvas.width, stripH, 0, 0, canvas.width, stripH); yy = stripH; }
        pcx.drawImage(canvas, 0, start, canvas.width, sliceH, 0, yy, canvas.width, sliceH);

        if(pageIdx > 0) doc.addPage();
        if(hdrPdf) doc.addImage(hdrPdf.data, hdrPdf.fmt, PDF_MARGIN_MM, PDF_MARGIN_MM, CW, hh);
        const contentMm = pageCanvas.height / pxPerMm;
        doc.addImage(pageCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', PDF_MARGIN_MM, topY, CW, contentMm);
        if(ftrPdf){
          const isLast = end >= canvas.height;
          const fy = isLast
            ? Math.min(topY + contentMm + PDF_GAP_MM, H - PDF_MARGIN_MM - fh)
            : H - PDF_MARGIN_MM - fh;
          doc.addImage(ftrPdf.data, ftrPdf.fmt, PDF_MARGIN_MM, fy, CW, fh);
        }
        start = end;
        pageIdx++;
      }

      const numero = (quote.numero || 'documento').replace(/[^a-zA-Z0-9_-]+/g, '_');
      const filename = `Accettazione_firmata_${numero}.pdf`;
      const dataUri = doc.output('datauristring');
      result = { base64: dataUri.split(',')[1], filename };
    }catch(err){
      console.error('Errore nella generazione del documento di accettazione firmato', err);
    }finally{
      node.remove();
    }
    return result;
  }

  async function storeSignedDocument(pdfBase64){
    try{
      await fetch('/.netlify/functions/public-quote', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ mode:'store-signed-document', token, pdfBase64 })
      });
    }catch(err){ /* la firma è già stata registrata: se il salvataggio del PDF fallisce, lo studio può comunque riscaricarlo più avanti se il caricamento fosse solo momentaneamente fallito, oppure il cliente può usare "Scarica documento firmato" qui sotto in un secondo momento */ }
  }

  async function downloadSignedDocumentPublic(btn){
    const originalText = btn.textContent;
    btn.textContent = 'Preparazione…';
    btn.disabled = true;
    try{
      const res = await fetch('/.netlify/functions/public-quote', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ mode:'download-signed-document', token })
      });
      if(!res.ok) throw new Error('not_found');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Accettazione_firmata.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(err){
      alert('Documento non ancora disponibile. Riprova tra poco.');
    }finally{
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }

  function renderSignArea(quote){
    const area = document.getElementById('signArea');
    if(quote.firma && quote.firma.firmato){
      const firmatoLabel = quote.firma.firmatoAt ? new Date(quote.firma.firmatoAt).toLocaleString('it-IT') : '';
      area.innerHTML = `
        <div class="signed-badge">
          <span>✓</span>
          <div>
            Preventivo firmato da ${esc(quote.firma.firmatarioNome)}
            <div class="signed-sub">${firmatoLabel}</div>
            <button type="button" class="signed-download-btn" id="downloadSignedBtn">Scarica il documento firmato (PDF)</button>
          </div>
        </div>`;
      const dlBtn = document.getElementById('downloadSignedBtn');
      if(dlBtn) dlBtn.addEventListener('click', ()=>downloadSignedDocumentPublic(dlBtn));
      return;
    }

    area.innerHTML = `
      <div class="section-label">Firma per accettazione</div>
      <div class="sign-pad-wrap" id="signPadWrap">
        <canvas id="signCanvas"></canvas>
        <div class="sign-hint" id="signHint">Firma qui col dito o col mouse</div>
      </div>
      <div class="sign-actions">
        <button type="button" class="link-btn" id="clearSignBtn">Cancella</button>
        <button type="button" class="link-btn" id="typeNameBtn">Digita il nome invece di firmare</button>
      </div>
      <div class="field" id="typedNameField" style="display:none;">
        <label>Nome e cognome</label>
        <input type="text" id="typedNameInput" placeholder="Es. Mario Rossi">
      </div>
      <label class="check-row">
        <input type="checkbox" id="acceptCheck">
        <span>Ho letto e accetto le condizioni del preventivo e i termini di pagamento indicati.</span>
      </label>
      <button type="button" class="btn-primary" id="confirmSignBtn" disabled>Conferma e firma</button>
      <div class="hint-row">Firma elettronica semplice ai sensi del Regolamento eIDAS (UE) 910/2014 — data/ora, indirizzo IP e impronta del documento vengono registrati come prova. Riceverai una conferma via email.</div>
      <div id="signErrorBox"></div>
    `;

    setupSignaturePad(quote);
  }

  function setupSignaturePad(quote){
    const canvas = document.getElementById('signCanvas');
    const wrap = document.getElementById('signPadWrap');
    const hint = document.getElementById('signHint');
    const ctx = canvas.getContext('2d');
    let drawing = false, hasDrawn = false;
    let typedMode = false;

    function resizeCanvas(){
      const rect = wrap.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = rect.width * ratio;
      canvas.height = 140 * ratio;
      ctx.scale(ratio, ratio);
      ctx.strokeStyle = '#17181C';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
    }
    resizeCanvas();

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    }
    function start(e){
      e.preventDefault();
      drawing = true; hasDrawn = true;
      hint.style.display = 'none';
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }
    function move(e){
      if(!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      updateConfirmState();
    }
    function end(){ drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);

    document.getElementById('clearSignBtn').addEventListener('click', ()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      hasDrawn = false;
      hint.style.display = 'flex';
      updateConfirmState();
    });

    document.getElementById('typeNameBtn').addEventListener('click', (e)=>{
      typedMode = !typedMode;
      document.getElementById('typedNameField').style.display = typedMode ? 'block' : 'none';
      e.target.textContent = typedMode ? 'Firma disegnata invece del nome' : 'Digita il nome invece di firmare';
      wrap.style.display = typedMode ? 'none' : 'block';
      document.querySelector('.sign-actions').style.display = typedMode ? 'flex' : 'flex';
      document.getElementById('clearSignBtn').style.display = typedMode ? 'none' : 'inline';
      updateConfirmState();
    });

    document.getElementById('typedNameInput').addEventListener('input', updateConfirmState);
    document.getElementById('acceptCheck').addEventListener('change', updateConfirmState);

    function updateConfirmState(){
      const check = document.getElementById('acceptCheck').checked;
      const ready = typedMode
        ? (document.getElementById('typedNameInput').value.trim().length > 2 && check)
        : (hasDrawn && check);
      document.getElementById('confirmSignBtn').disabled = !ready;
    }

    document.getElementById('confirmSignBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('confirmSignBtn');
      const errBox = document.getElementById('signErrorBox');
      errBox.innerHTML = '';
      let firmatarioNome, metodo, firmaImage = '';
      if(typedMode){
        firmatarioNome = document.getElementById('typedNameInput').value.trim();
        metodo = 'nome_digitato';
      } else {
        firmatarioNome = window.prompt('Conferma il tuo nome e cognome per completare la firma:', '') || '';
        firmatarioNome = firmatarioNome.trim();
        if(!firmatarioNome){ return; }
        metodo = 'disegnata';
        firmaImage = canvas.toDataURL('image/png');
      }
      if(!firmatarioNome){
        errBox.innerHTML = '<div class="error-box">Inserisci nome e cognome.</div>';
        return;
      }
      btn.disabled = true; btn.textContent = 'Firma in corso…';
      try{
        const res = await fetch('/.netlify/functions/public-quote', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ mode:'sign', token, firmatarioNome, metodo, firmaImage, accettaCondizioni:true })
        });
        const data = await res.json();
        if(data.error){
          errBox.innerHTML = `<div class="error-box">Non è stato possibile registrare la firma. Riprova o contatta lo studio.</div>`;
          btn.disabled = false; btn.textContent = 'Conferma e firma';
          return;
        }
        quote.firma = { firmato:true, firmatarioNome, firmatoAt:data.firmatoAt, metodo, firmaImage, ip:data.ip, hashDocumento:data.hashDocumento };
        renderSignArea(quote);
        renderPaymentsArea(quote);
        // Genera e conserva il documento di accettazione firmato: non deve bloccare né
        // rallentare la conferma già mostrata al cliente, per questo non è "await"-ato qui.
        generateSignedDocumentPdf(currentStudio, quote).then(pdf => {
          if(pdf) storeSignedDocument(pdf.base64);
        });
      }catch(err){
        errBox.innerHTML = '<div class="error-box">Errore di connessione. Riprova.</div>';
        btn.disabled = false; btn.textContent = 'Conferma e firma';
      }
    });
  }
})();
</script>
</body>
</html>
