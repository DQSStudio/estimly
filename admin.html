<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>DESEARQ — Gestione licenze</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#FAFAFA; color:#17181C; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px; padding:32px 20px;
  }
  .wrap{max-width:720px; margin:0 auto;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:#7A7C85; font-size:13px; margin-bottom:24px;}
  .card{background:#fff; border:1px solid #E6E6E9; border-radius:10px; padding:20px; margin-bottom:16px;}
  input{
    width:100%; padding:10px; border:1px solid #E6E6E9; border-radius:6px; font-size:13.5px;
    font-family:inherit; margin-bottom:10px;
  }
  button{
    padding:10px 16px; border:none; border-radius:6px; background:#4338CA; color:#fff;
    font-size:13px; font-weight:500; cursor:pointer;
  }
  button:hover{background:#362BA8;}
  button.secondary{background:#fff; color:#17181C; border:1px solid #E6E6E9;}
  button.secondary:hover{background:#F4F4F5;}
  button.danger{background:#fff; color:#DC2626; border:1px solid #E6E6E9;}
  button.danger:hover{background:#FDECEC;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid #F0F0F2;}
  th{font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#B4B6BE;}
  .key-mono{font-family:'SF Mono',Consolas,monospace; font-size:12.5px;}
  .badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:600; text-transform:uppercase;}
  .badge-active{background:#E9F5F3; color:#0F766E;}
  .badge-revoked{background:#FDECEC; color:#DC2626;}
  .badge-ai{background:#EEEDFB; color:#4338CA;}
  .badge-followup{background:#FDF0E3; color:#B45309;}
  .badge-costcalc{background:#E7F0FE; color:#1D4ED8;}
  #loginCard input{margin-bottom:12px;}
  #appArea{display:none;}
  .error{color:#DC2626; font-size:12.5px; margin-top:6px;}
  .row{display:flex; gap:8px; align-items:flex-end;}
  .row > div{flex:1;}
  .newkey-result{margin-top:12px; padding:12px; background:#EEEDFB; border-radius:6px; font-size:13px;}
  .newkey-result .key-mono{font-size:15px; font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gestione licenze — DESEARQ Preventivatore</h1>
  <div class="sub">Pagina riservata: crea, controlla e revoca le chiavi di licenza dei clienti.</div>

  <div class="card" id="loginCard">
    <label>Password amministratore</label>
    <input type="password" id="adminPassword" placeholder="Password">
    <button id="loginBtn">Accedi</button>
    <div class="error" id="loginError" style="display:none;"></div>
  </div>

  <div id="appArea">
    <div class="card">
      <label>Nome cliente</label>
      <div class="row">
        <div><input id="customerName" placeholder="Es. Studio Rossi Architettura"></div>
        <div style="flex:0 0 auto;"><button id="addKeyBtn">+ Crea chiave</button></div>
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-weight:normal; margin-top:4px;">
        <input type="checkbox" id="aiEnabledNew" style="width:auto; margin:0;"> Abilita EstimlyAI per questo cliente
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-weight:normal; margin-top:4px;">
        <input type="checkbox" id="followupEnabledNew" style="width:auto; margin:0;"> Abilita Follow-up automatico (Estimly 2.0) per questo cliente
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-weight:normal; margin-top:4px;">
        <input type="checkbox" id="costCalcEnabledNew" style="width:auto; margin:0;"> Abilita "Calcola il tuo costo orario" in Estimly normale per questo cliente
      </label>
      <div id="newKeyResult" style="display:none;" class="newkey-result"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <b>Chiavi emesse</b>
        <button class="secondary" id="refreshBtn">Aggiorna</button>
      </div>
      <table>
        <thead><tr><th>Cliente</th><th>Chiave</th><th>Stato</th><th>EstimlyAI</th><th>Follow-up 2.0</th><th>Costo orario (normale)</th><th>Creata</th><th>Usi</th><th>Backup</th><th></th></tr></thead>
        <tbody id="keysBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let adminPassword = '';

function fmtDate(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleDateString('it-IT') + ' ' + new Date(iso).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return iso; }
}

async function callAdmin(action, extra){
  const res = await fetch('/.netlify/functions/admin-keys', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
    body: JSON.stringify(Object.assign({ action }, extra || {}))
  });
  if(res.status === 401) throw new Error('unauthorized');
  return res.json();
}

async function loadKeys(){
  const data = await callAdmin('list');
  const body = document.getElementById('keysBody');
  if(!data.items || data.items.length === 0){
    body.innerHTML = '<tr><td colspan="10" style="color:#B4B6BE; text-align:center; padding:20px;">Nessuna chiave ancora emessa.</td></tr>';
    return;
  }
  body.innerHTML = data.items.map(it => `
    <tr>
      <td>${it.customer || '—'}</td>
      <td class="key-mono">${it.key}</td>
      <td><span class="badge badge-${it.status}">${it.status === 'active' ? 'Attiva' : 'Revocata'}</span></td>
      <td>
        ${it.aiEnabled
          ? `<span class="badge badge-ai">Attiva</span> <button class="secondary" data-ai-action="off" data-key="${it.key}" style="padding:4px 8px; font-size:11px;">Disattiva</button>`
          : `<button class="secondary" data-ai-action="on" data-key="${it.key}" style="padding:4px 8px; font-size:11px;">Attiva EstimlyAI</button>`}
      </td>
      <td>
        ${it.followupEnabled
          ? `<span class="badge badge-followup">Attivo</span> <button class="secondary" data-followup-action="off" data-key="${it.key}" style="padding:4px 8px; font-size:11px;">Disattiva</button>`
          : `<button class="secondary" data-followup-action="on" data-key="${it.key}" style="padding:4px 8px; font-size:11px;">Attiva Follow-up</button>`}
      </td>
      <td>
        ${it.costCalcEnabled
          ? `<span class="badge badge-costcalc">Attivo</span> <button class="secondary" data-costcalc-action="off" data-key="${it.key}" style="padding:4px 8px; font-size:11px;">Disattiva</button>`
          : `<button class="secondary" data-costcalc-action="on" data-key="${it.key}" style="padding:4px 8px; font-size:11px;">Attiva</button>`}
      </td>
      <td>${fmtDate(it.createdAt)}</td>
      <td>${it.validationCount || 0}</td>
      <td>
        <button class="secondary" data-download-backup="${it.key}" data-customer="${(it.customer||'cliente').replace(/"/g,'')}" style="padding:4px 8px; font-size:11px;">Scarica</button>
        <label class="secondary" style="display:inline-block; padding:4px 8px; font-size:11px; border:1px solid #E6E6E9; border-radius:6px; cursor:pointer; margin-left:4px;">
          Ripristina
          <input type="file" accept=".json" data-restore-backup="${it.key}" style="display:none;">
        </label>
      </td>
      <td>
        ${it.status === 'active'
          ? `<button class="danger" data-action="revoke" data-key="${it.key}">Revoca</button>`
          : `<button class="secondary" data-action="activate" data-key="${it.key}">Riattiva</button>`}
      </td>
    </tr>
  `).join('');

  body.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await callAdmin(btn.getAttribute('data-action'), { key: btn.getAttribute('data-key') });
      loadKeys();
    });
  });

  body.querySelectorAll('button[data-ai-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const aiEnabled = btn.getAttribute('data-ai-action') === 'on';
      await callAdmin('setAi', { key: btn.getAttribute('data-key'), aiEnabled });
      loadKeys();
    });
  });

  body.querySelectorAll('button[data-followup-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const followupEnabled = btn.getAttribute('data-followup-action') === 'on';
      await callAdmin('setFollowup', { key: btn.getAttribute('data-key'), followupEnabled });
      loadKeys();
    });
  });

  body.querySelectorAll('button[data-costcalc-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const costCalcEnabled = btn.getAttribute('data-costcalc-action') === 'on';
      await callAdmin('setCostCalc', { key: btn.getAttribute('data-key'), costCalcEnabled });
      loadKeys();
    });
  });

  body.querySelectorAll('button[data-download-backup]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try{
        const key = btn.getAttribute('data-download-backup');
        const customer = btn.getAttribute('data-customer');
        const result = await callAdmin('exportData', { key });
        const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0,10);
        a.href = url;
        a.download = `backup_${customer}_${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }catch(err){
        alert('Impossibile scaricare il backup.');
      }
      btn.disabled = false;
    });
  });

  body.querySelectorAll('input[data-restore-backup]').forEach(input => {
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const key = input.getAttribute('data-restore-backup');
      if(!confirm(`Ripristinare i dati da questo file per la chiave ${key}? I dati attuali del cliente verranno sovrascritti (una copia di sicurezza viene comunque salvata automaticamente prima).`)){
        e.target.value = '';
        return;
      }
      try{
        const text = await file.text();
        const parsed = JSON.parse(text);
        const data = parsed.data || parsed;
        await callAdmin('importData', { key, data });
        alert('Backup ripristinato con successo.');
      }catch(err){
        alert('File non valido o errore nel ripristino.');
      }
      e.target.value = '';
    });
  });
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  adminPassword = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try{
    await loadKeys();
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('appArea').style.display = 'block';
  }catch(err){
    errEl.textContent = 'Password errata.';
    errEl.style.display = 'block';
  }
});
document.getElementById('adminPassword').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('addKeyBtn').addEventListener('click', async () => {
  const customer = document.getElementById('customerName').value.trim();
  if(!customer) return;
  const aiEnabled = document.getElementById('aiEnabledNew').checked;
  const followupEnabled = document.getElementById('followupEnabledNew').checked;
  const costCalcEnabled = document.getElementById('costCalcEnabledNew').checked;
  const result = await callAdmin('add', { customer, aiEnabled, followupEnabled, costCalcEnabled });
  const box = document.getElementById('newKeyResult');
  box.style.display = 'block';
  box.innerHTML = `Chiave creata per <b>${result.customer}</b>${result.aiEnabled ? ' <span class="badge badge-ai">EstimlyAI</span>' : ''}${result.followupEnabled ? ' <span class="badge badge-followup">Follow-up</span>' : ''}${result.costCalcEnabled ? ' <span class="badge badge-costcalc">Costo orario</span>' : ''}:<br><span class="key-mono">${result.key}</span>`;
  document.getElementById('customerName').value = '';
  document.getElementById('aiEnabledNew').checked = false;
  document.getElementById('followupEnabledNew').checked = false;
  document.getElementById('costCalcEnabledNew').checked = false;
  loadKeys();
});

document.getElementById('refreshBtn').addEventListener('click', loadKeys);
</script>
</body>
</html>
